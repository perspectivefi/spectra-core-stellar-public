[package]
name = "spectra-mocks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Test fixtures shared across the workspace's test suites: minimal SEP-41
# underlying, 4626-like IBT, recording rewards proxy, and a recording
# PrincipalToken stub. Lives under `mocks/` (not `contracts/`) to make
# clear it never ships to mainnet — production wasm only comes from
# `contracts/`. Pull in via `dev-dependencies` only.

[dependencies]
soroban-sdk = { workspace = true }
spectra-common = { workspace = true }
spectra-math = { workspace = true }
stellar-tokens = { workspace = true }
blend-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1.0"
rand = "0.8"
