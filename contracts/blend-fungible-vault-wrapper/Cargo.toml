[package]
name = "blend-fungible-vault-wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
spectra-common = { workspace = true }
spectra-math = { workspace = true }
spectra-fungible-vault-wrapper = { workspace = true }
blend-types = { workspace = true }
stellar-access = { workspace = true }
stellar-contract-utils = { workspace = true }
stellar-macros = { workspace = true }
stellar-tokens = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
spectra-mocks = { workspace = true }
principal-token = { path = "../principal-token" }
registry = { path = "../registry" }
# Mainnet-fork e2e: measure the liquidity-aware max_* views against a live
# Blend pool under the real per-invocation memory cap. Versions match the
# limit-order-engine crate's existing fork dev-deps.
soroban-fork = "0.9"
# Names `InvocationResourceLimits` so the fork test can raise the per-
# invocation memory cap for cost-estimate accounting. Already transitive via
# soroban-sdk; pinned to the resolved version.
soroban-env-host = "=25.0.1"
